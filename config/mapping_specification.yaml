# =====================================================================
# TRANSFORMATION FUNCTIONS
# =====================================================================
# Named routines referenced above. Implemented in
# src/transform/transformations.py. Listed here so the specification
# is complete without reading code.
# =====================================================================

transformations:

  parse_uk_date:
    description: "Parse a free-text date into a date object."
    accepted_formats:
      - "DD/MM/YYYY"
      - "DD-MM-YYYY"
      - "YYYY-MM-DD"
      - "DD.MM.YYYY"
      - "DD MMM YYYY"
      - "DDMMYYYY"
    ambiguity_rule: >
      Where a date could be read as either DD/MM or MM/DD, UK order is
      assumed. Dates where the day is 12 or lower are flagged as
      ambiguous for review, since they cannot be verified.
    on_failure: "Return null, raise HIGH defect"

  normalise_ni_number:
    description: "Normalise a National Insurance number."
    steps:
      - "Upper case"
      - "Remove all whitespace and punctuation"
    validation_pattern: "^[A-CEGHJ-PR-TW-Z]{2}[0-9]{6}[A-D]$"
    on_failure: "Return null, raise CRITICAL defect"
    notes: >
      The pattern excludes prefixes D, F, I, Q, U and V, and the second
      letter O, per HMRC specification.

  normalise_uk_postcode:
    description: "Normalise a UK postcode."
    steps:
      - "Upper case"
      - "Strip all whitespace"
      - "Insert a single space before the final three characters"
    validation_pattern: "^[A-Z]{1,2}[0-9][A-Z0-9]? ?[0-9][A-Z]{2}$"
    on_failure: "Return the trimmed original, raise HIGH defect"

  normalise_sort_code:
    description: "Normalise a UK bank sort code."
    steps:
      - "Strip hyphens, spaces and full stops"
    validation_pattern: "^[0-9]{6}$"
    on_failure: "Return null, raise CRITICAL defect"

  normalise_account_number:
    description: "Normalise a UK bank account number."
    steps:
      - "Strip all non-digits"
      - "Left pad with zeros to 8 digits where 6 or 7 digits remain"
    validation_pattern: "^[0-9]{8}$"
    on_failure: "Return null, raise CRITICAL defect"
    rationale: >
      Leading zeros are routinely lost when extracts pass through
      spreadsheets. Padding recovers them. Numbers shorter than 6
      digits are too damaged to recover safely.

  normalise_fte:
    description: "Normalise full-time equivalent to a percentage."
    accepted_inputs:
      - "Decimal fraction, for example 1.0 or 0.5"
      - "Percentage with symbol, for example 100% or 50%"
      - "Whole number, for example 1"
    output: "Numeric percentage between 0 exclusive and 100 inclusive"
    on_failure: "Default to 100, raise MEDIUM defect"

  trim:
    description: "Remove leading and trailing whitespace, collapse internal runs to one space."

  title_case:
    description: "Capitalise the first letter of each word, preserving Mc, Mac and O' prefixes."


# =====================================================================
# DEFECT SEVERITY DEFINITIONS
# =====================================================================

defect_severity:
  CRITICAL:
    description: "Prevents payment or breaches statutory obligation."
    action: "Record rejected. Must be resolved before go-live."
    examples:
      - "Invalid or missing NI number"
      - "Invalid bank details"
      - "Conflicting date of birth between sources"
      - "Employee paid after their recorded leaving date"

  HIGH:
    description: "Record loads but is materially incorrect or incomplete."
    action: "Loaded with defect raised. Resolution required before go-live."
    examples:
      - "Unparseable employment date"
      - "Invalid postcode"
      - "Unmapped employment status"

  MEDIUM:
    description: "Record loads with a documented assumption applied."
    action: "Loaded. Reviewed as a batch, resolution optional."
    examples:
      - "Cost centre conflict resolved by survivorship"
      - "Location not present in mapping table"
      - "Account holder name differs from employee name"

  LOW:
    description: "Cosmetic or low-impact difference."
    action: "Logged only. No action required."
    examples:
      - "Name formatting difference between sources"
      - "Unmapped marital status"


# =====================================================================
# OPEN ISSUES
# =====================================================================
# Matters requiring business decision before sign-off. A specification
# without open issues has not been examined closely enough.
# =====================================================================

open_issues:
  - id: "OI-01"
    title: "Historical organisational assignment is not migratable"
    description: >
      Neither source holds cost centre or department history. All
      historical payroll cost in SAP will be attributed to the
      employee's current cost centre.
    impact: "Historical cost reporting in SAP will not match legacy reports."
    owner: "Finance"
    status: "OPEN"

  - id: "OI-02"
    title: "Salary history before the payment history window"
    description: >
      Employees hired before the payment history window receive a
      back-dated record at the earliest observed salary, understating
      their true historical pay.
    impact: "Long service employees will show an inaccurate early salary."
    owner: "HR"
    status: "OPEN"

  - id: "OI-03"
    title: "Mid-month pay changes cannot be distinguished from unpaid leave"
    description: >
      Both produce a partial payment period. Rule PAY-03 treats them
      identically and flags affected records for review.
    impact: "Manual review required for all flagged records."
    owner: "Payroll"
    status: "OPEN"

  - id: "OI-04"
    title: "Manager reporting lines cannot be represented"
    description: >
      SAP represents reporting through position relationships. Positions
      are not in scope, so the manager relationship held in HR.net has
      no target.
    impact: "Org chart reporting unavailable at go-live."
    owner: "HR"
    status: "OPEN"

  - id: "OI-05"
    title: "Building society roll numbers have no target field"
    description: >
      Field bkref on PA0009 is out of scope. Affected employees are
      listed for manual entry post-migration.
    impact: "Small number of employees require manual bank detail entry."
    owner: "Payroll"
    status: "OPEN"
