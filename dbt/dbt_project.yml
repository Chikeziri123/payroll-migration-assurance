name: 'payroll_migration_assurance'
version: '1.0.0'
config-version: 2

# Points at the profile block in dbt/profiles.yml, not the one in ~/.dbt.
# Keeping the profile inside the repo means the whole project is
# self-contained and reviewable. Credentials stay in .env and are read
# through env_var(), so nothing secret lands in a committed file.
profile: 'payrollmig'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  payroll_migration_assurance:
    reconciliation:
      # Reconciliation output is evidence, not a view. It has to persist
      # after the run so Phase 8 Power BI reads exactly the same rows the
      # tests asserted on. A view would be re-evaluated at dashboard
      # refresh time and could silently drift from the tested result.
      +materialized: table

# Fail loudly by default. A reconciliation test that warns is a
# reconciliation that nobody reads.
tests:
  payroll_migration_assurance:
    +severity: error
